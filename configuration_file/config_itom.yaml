# European ITOM steel; rebuild with python 0_convert_ITOM_steel_to_IAMC.py.
---
regionalize:
  datasets:
    - name: steel production, electric, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, blast furnace-basic oxygen furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, blast furnace-basic oxygen furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, hydrogen-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  

production pathways:
  steel_bof:
    production volume:
      variable: Production|Steel|BF/BOF
    ecoinvent alias:
      name: steel production, blast furnace-basic oxygen furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True

  steel_eaf_scrap:
    # High-level route output. Do not add a second primary/secondary blending step.
    production volume:
      variable: Production|Steel|Secondary steel
    ecoinvent alias:
      name: steel production, electric, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True

  steel_eaf_dri_ng:
    production volume:
      variable: Production|Steel|DRI_NG
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True    

  steel_eaf_dri_h2:
    production volume:
      variable: Production|Steel|DRI_H2
    ecoinvent alias:
      name: steel production, hydrogen-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True     

  steel_eaf_dri_ng_h2:
    production volume:
      variable: Production|Steel|DRI_NG_H2
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed (ITOM DRI NG-H2 proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

  steel_eaf_dri_unresolved:
    production volume:
      variable: Production|Steel|DRI_unresolved
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed (ITOM DRI unresolved proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

  steel_eaf_hbi_ng:
    # Explicit HBI_import_NG plus the NG share of intra-EU HBI's proxy mix.
    production volume:
      variable: Production|Steel|HBI_NG
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed (ITOM HBI NG proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

  steel_eaf_hbi_h2:
    # Explicit HBI_import_H2 plus the H2 share of intra-EU HBI's proxy mix.
    production volume:
      variable: Production|Steel|HBI_H2
    ecoinvent alias:
      name: steel production, hydrogen-based direct reduction iron-electric arc furnace, low-alloyed (ITOM HBI H2 proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

  steel_eaf_hbi_ng_h2:
    production volume:
      variable: Production|Steel|HBI_NG_H2
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed (ITOM HBI NG-H2 proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

  steel_eaf_hbi_unresolved:
    production volume:
      variable: Production|Steel|HBI_unresolved
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed (ITOM HBI unresolved proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

markets:
- name: market for steel, low-alloyed (ITOM)
  reference product: steel, low-alloyed
  unit: kilogram
  except regions:
  - World
  includes:
  - steel_bof
  - steel_eaf_scrap
  - steel_eaf_dri_ng
  - steel_eaf_dri_h2
  - steel_eaf_dri_ng_h2
  - steel_eaf_dri_unresolved
  - steel_eaf_hbi_ng
  - steel_eaf_hbi_h2
  - steel_eaf_hbi_ng_h2
  - steel_eaf_hbi_unresolved
  replaces:
  - name: market for steel, low-alloyed
    product: steel, low-alloyed
  replaces in:
  - excludes:
      location: GLO
  - excludes:
      location: RoW
  - excludes:
      location: World

- name: market for steel, unalloyed (ITOM)
  reference product: steel, unalloyed
  unit: kilogram
  except regions:
  - World
  includes:
  - steel_bof
  - steel_eaf_scrap
  - steel_eaf_dri_ng
  - steel_eaf_dri_h2
  - steel_eaf_dri_ng_h2
  - steel_eaf_dri_unresolved
  - steel_eaf_hbi_ng
  - steel_eaf_hbi_h2
  - steel_eaf_hbi_ng_h2
  - steel_eaf_hbi_unresolved
  replaces:
  - name: market for steel, unalloyed
    product: steel, unalloyed
  replaces in:
  - excludes:
      location: GLO
  - excludes:
      location: RoW
  - excludes:
      location: World