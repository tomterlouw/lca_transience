# Generated by 0_convert_FORECAST_steel_to_IAMC.py from forecast_steel_routes.yaml.
# BOF/NG-DRI CCS use native CCS inventories. Scrap-EAF CCS remains unresolved.
# Native capture assumptions are proxies pending FORECAST-specific coefficients.
# RER country supply is applied by the repository post-update export hook.
# RER is a second view of country production, never additional output.
regionalize:
  datasets:
  - name: steel production, blast furnace-basic oxygen furnace, low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true
  - name: steel production, electric, low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true
  - name: steel production, natural gas-based direct reduction iron-electric arc furnace,
      low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true
  - name: steel production, blast furnace-basic oxygen furnace, with carbon capture
      and storage, low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true
  - name: steel production, natural gas-based direct reduction iron-electric arc furnace,
      with carbon capture and storage, low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true
  - name: steel production, electrowinning-electric arc furnace, low-alloyed
    reference product: steel, low-alloyed
    exists in original database: true

production pathways:
  steel_bof:
    production volume:
      variable: Production|Steel|BF/BOF
    ecoinvent alias:
      name: steel production, blast furnace-basic oxygen furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: true
  steel_eaf_scrap:
    production volume:
      variable: Production|Steel|Secondary steel
    ecoinvent alias:
      name: steel production, electric, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: true
  steel_eaf_dri_ng:
    production volume:
      variable: Production|Steel|DRI_NG
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc
        furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: true
  steel_bof_ccs:
    production volume:
      variable: Production|Steel|BF/BOF_CCS
    ecoinvent alias:
      name: steel production, blast furnace-basic oxygen furnace, with carbon capture
        and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: true
  steel_eaf_dri_ng_ccs:
    production volume:
      variable: Production|Steel|DRI_NG_CCS
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc
        furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: true
  steel_eaf_scrap_ccs:
    production volume:
      variable: Production|Steel|Secondary steel_CCS
    ecoinvent alias:
      name: steel production, low-alloyed (FORECAST scrap EAF CCS unresolved proxy)
      reference product: steel, low-alloyed
      exists in original database: false
      regionalize: true

markets:
- name: market for steel, low-alloyed (FORECAST-sites)
  reference product: steel, low-alloyed
  unit: kilogram
  except regions:
  - World
  includes:
  - steel_bof
  - steel_eaf_scrap
  - steel_eaf_dri_ng
  - steel_bof_ccs
  - steel_eaf_dri_ng_ccs
  - steel_eaf_scrap_ccs
  replaces:
  - name: market for steel, low-alloyed
    product: steel, low-alloyed
  replaces in:
  - excludes:
      location: GLO
  - excludes:
      location: RoW
  - excludes:
      location: World

- name: market for steel, unalloyed (FORECAST-sites)
  reference product: steel, unalloyed
  unit: kilogram
  except regions:
  - World
  includes:
  - steel_bof
  - steel_eaf_scrap
  - steel_eaf_dri_ng
  - steel_bof_ccs
  - steel_eaf_dri_ng_ccs
  - steel_eaf_scrap_ccs
  replaces:
  - name: market for steel, unalloyed
    product: steel, unalloyed
  replaces in:
  - excludes:
      location: GLO
  - excludes:
      location: RoW
  - excludes:
      location: World