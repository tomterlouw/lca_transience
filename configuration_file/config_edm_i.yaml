# Configuration file for custom scenarios for `premise`
---
regionalize:
  datasets:
    - name: steel production, electric, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, blast furnace-basic oxygen furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, blast furnace-basic oxygen furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, hydrogen-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, natural gas-based direct reduction iron-electric arc furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  
    - name: steel production, electrowinning-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  

production pathways:
  steel_secondary:
    production volume:
      variable: Production|Steel|Secondary steel
    ecoinvent alias:
      name: steel production, electric, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True

  steel_primary:
    production volume:
      variable: Production|Steel|BF/BOF
    ecoinvent alias:
      name: steel production, blast furnace-basic oxygen furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True

  steel_primary_ccs:
    production volume:
      variable: Production|Steel|BF/BOF_CCS
    ecoinvent alias:
      name: steel production, blast furnace-basic oxygen furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True    

  steel_primary_dri_h2:
    production volume:
      variable: Production|Steel|DRI_H2
    ecoinvent alias:
      name: steel production, hydrogen-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True     

  steel_primary_dri_ng:
    production volume:
      variable: Production|Steel|DRI_NG
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True    

  steel_primary_dri_ng_ccs:
    production volume:
      variable: Production|Steel|DRI/EAF_NG_CCS
    ecoinvent alias:
      name: steel production, natural gas-based direct reduction iron-electric arc furnace, with carbon capture and storage, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True  

  steel_primary_mo_electrolysis:
    production volume:
      variable: Production|Steel|Electrolysis
    ecoinvent alias:
      name: steel production, electrowinning-electric arc furnace, low-alloyed
      reference product: steel, low-alloyed
      exists in original database: True

markets:
  - name: market for steel, low-alloyed (SPS)
    reference product: steel, low-alloyed
    unit: kilogram
    includes:
      - steel_secondary
      - steel_primary
      - steel_primary_ccs
      - steel_primary_dri_h2
      - steel_primary_dri_ng
      - steel_primary_mo_electrolysis
      - steel_primary_dri_ng_ccs

    replaces:
      - name: market for steel, low-alloyed
        product: steel, low-alloyed
        location: EUR

      - name: market for steel, low-alloyed
        product: steel, low-alloyed
        location: RER

      - name: market for steel, low-alloyed
        product: steel, low-alloyed
        location: NEU

      - name: market for steel, low-alloyed
        product: steel, low-alloyed
        location: Europe without Switzerland
# THIS IS ONLY FOR ACTIVITIES REPLACING HAVING THOSE LOCATIONS IN ACTIVITY IDENTITY
#    replaces in:
#      - location: GLO
#      - location: EUR
#      - location: RER
#      - location: NEU
#      - location: Europe without Switzerland

  - name: market for steel, unalloyed (SPS)
    reference product: steel, unalloyed
    unit: kilogram
    includes:
      - steel_secondary
      - steel_primary
      - steel_primary_ccs
      - steel_primary_dri_h2
      - steel_primary_dri_ng
      - steel_primary_mo_electrolysis
      - steel_primary_dri_ng_ccs

    replaces:
      - name: market for steel, unalloyed
        product: steel, unalloyed
        location: EUR

      - name: market for steel, unalloyed
        product: steel, unalloyed
        location: RER

      - name: market for steel, unalloyed
        product: steel, unalloyed
        location: NEU

      - name: market for steel, unalloyed
        product: steel, unalloyed
        location: Europe without Switzerland
# THIS IS ONLY FOR ACTIVITIES REPLACING HAVING THOSE LOCATIONS IN ACTIVITY IDENTITY
#    replaces in:
#      - location: GLO
#      - location: EUR
#      - location: RER
#      - location: NEU
#      - location: Europe without Switzerland

  # Replace primary steel acts
  - name: steel production, converter, low-alloyed (SPS)
    reference product: steel, low-alloyed
    unit: kilogram
    includes:
      - steel_secondary
      - steel_primary
      - steel_primary_ccs
      - steel_primary_dri_h2
      - steel_primary_dri_ng
      - steel_primary_mo_electrolysis
      - steel_primary_dri_ng_ccs

    replaces:
      - name: steel production, converter, low-alloyed
        product: steel, low-alloyed
        location: EUR

      - name: steel production, converter, low-alloyed
        product: steel, low-alloyed
        location: RER

      - name: steel production, converter, low-alloyed
        product: steel, low-alloyed
        location: NEU

      - name: steel production, converter, low-alloyed
        product: steel, low-alloyed
        location: Europe without Switzerland

  # Replace primary steel acts
  - name: steel production, converter, unalloyed (SPS)
    reference product: steel, unalloyed
    unit: kilogram
    includes:
      - steel_secondary
      - steel_primary
      - steel_primary_ccs
      - steel_primary_dri_h2
      - steel_primary_dri_ng
      - steel_primary_mo_electrolysis
      - steel_primary_dri_ng_ccs

    replaces:
      - name: steel production, converter, unalloyed
        product: steel, unalloyed
        location: EUR

      - name: steel production, converter, unalloyed
        product: steel, unalloyed
        location: RER

      - name: steel production, converter, unalloyed
        product: steel, unalloyed
        location: NEU

      - name: steel production, converter, unalloyed
        product: steel, unalloyed
        location: Europe without Switzerland
