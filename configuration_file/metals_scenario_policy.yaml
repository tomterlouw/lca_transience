# Repo-owned non-ferrous supply-mix sensitivities, AFTER native premise updates.
# Baseline is deliberately a no-op in every premise version.
schema_version: 1
metadata:
  description: >-
    Explicit primary/secondary supply assumptions for refined non-ferrous metals
    only. Steel stays endogenous to REMIND or the selected EDM-I model.
    These are recycled-input sensitivities, not
    end-of-life recycling rates, avoided-burden credits or scrap-stock forecasts.
  reference_source: primary_vs_secondary_metals/scenario_data/metal_shares_2050_scenarios.yaml
  reference_source_note: >-
    Live scenario files are read from share_data below. Matching and safeguards
    stay here; numeric reference/target assumptions are not duplicated here.
    These model-specific shares do not establish observed content in every region.
  default_nonferrous_case: baseline
  interpolation: linear_between_years_clamped_to_endpoints
  unsupported_product_policy: leave_native_and_report
  sources:
    iea_recycling_2024:
      url: https://www.iea.org/reports/recycling-of-critical-minerals/executive-summary
      accessed: 2026-10-23
      note: >-
        Figure 2.16 reports 2050 battery-derived secondary supply divided by
        global total demand, including manufacturing scrap and retired EV/storage
        batteries. Rounded nickel proxies are 15/22/30% and cobalt 20/30/40%.
        This excludes non-battery secondary sources and is not a class-1 nickel
        or product-grade cobalt forecast. Applying those ratios to the retained
        recovery recipes is a qualified sensitivity, not full scenario replication.
    ica_copper_2023:
      url: https://internationalcopper.org/wp-content/uploads/2023/03/Copper_The-Pathway-to-Net-Zero_Focus-on-Europe_final.pdf
      accessed: 2026-10-13
      note: >-
        Reports an EU 2050 end-of-life scrap contribution to refined copper of
        approximately 26-29%. It does not establish a global cathode target.
    jrc_aluminium_2024:
      url: https://publications.jrc.ec.europa.eu/repository/handle/JRC136525
      accessed: 2026-10-23
      note: >-
        The resource-efficiency section gives 60 Mt BAU and over 70 Mt maximised
        collection of post-consumer aluminium recycling in 2050: volumes, not
        percentages. The revised 45/55/65% global cast-alloy floors are analyst
        sensitivities, not exact JRC product-grade forecasts.
    van_der_voet_2019:
      url: https://doi.org/10.1111/jiec.12722
      accessed: 2026-10-13
      note: >-
        Stock-flow-informed scenarios include 77% secondary lead in 2050.
        The 65% and 85% endpoints below bracket this as repo sensitivities.

    iea_critical_minerals_2026:
      url: https://www.iea.org/reports/global-critical-minerals-outlook-2026
      pdf: https://iea.blob.core.windows.net/assets/19c60aa0-ee07-4a20-a138-33c967ac5008/GlobalCriticalMineralsOutlook2026.pdf
      accessed: 2026-10-23
      note: >-
        Pages 145 and 350 give approximate 2050 recycled lithium supply of
        250 kt in the STEPS-context base case and 560 kt in HDS, against total
        global demand of 1122 and 1501 kt Li respectively. Derived fractions
        are about 22.3% and 37.3%, not measured battery-grade carbonate shares.
        The source quantities were independently rechecked on 23 October 2026;
        their rounded numerators do not support forecast precision. Conservative
        15% is a separate analyst lower-collection sensitivity, not an IEA estimate.
        No complete 2026 intermediate-year recycling series was verified.

    wgc_gold_2025:
      url: https://www.gold.org/goldhub/research/gold-demand-trends/gold-demand-trends-full-year-2025/supply
      publication_date: 2026-01-29
      accessed: 2026-10-20
      note: >-
        2025 physical supply anchor: recycled 1404.3 t divided by mine 3671.6 t
        plus recycled 1404.3 t = 0.2766602966961524. Excludes net producer hedging.
        This is not a 2050 forecast. Hold this anchor in conservative; add 0.10
        and 0.20 absolute share in moderate/high as analyst-selected sensitivities.
    silver_survey_2026:
      url: https://silverinstitute.org/wp-content/uploads/2026/04/World-Silver-Survey-2026.pdf
      accessed: 2026-10-20
      note: >-
        2025 physical supply anchor: recycled 197.6 Moz divided by mine 846.6 Moz
        plus recycled 197.6 Moz = 0.1892357785864777. Excludes hedging, official
        sector sales and stock movements. The 2050 increments are analyst
        sensitivities, not published projections.
    jm_pgm_2026:
      url: https://matthey.com/documents/161599/509428/pgm-market-report-26.pdf/a2d115af-bf7c-f589-29e9-6beacf8a4452
      publication_date: 2026-05-14
      accessed: 2026-10-20
      note: >-
        May 2026 report pp27-30, 2025 actual estimates in thousand troy oz:
        Pt secondary1547/(primary5557+secondary1547)=0.2177646396396396;
        Pd secondary3135/(primary6589+secondary3135)=0.3223981900452489.
        Open-loop secondary supply; industrial demand is net of closed-loop
        recycling. No extra industrial closed-loop contribution is added.
        These are 2025 anchors; 2050 increments are analyst-selected sensitivities.
    ecoinvent_parkes_origin:
      url: https://ecoquery.ecoinvent.org/3.11/cutoff/dataset/3511
      accessed: 2026-10-20
      note: >-
        Primary lead production from concentrate also produces Parkes crust.
        Its subsequent treatment is not sufficient evidence of post-consumer
        or manufacturing-scrap recycling. Keep this silver stream in the
        non-secondary remainder rather than expanding it as recycled supply.

# Repo-owned, commit-pinned supplier selectors; never overwrite site-packages.
# Their shares describe the recipe WITHIN secondary supply, not recycled content.
secondary_supply_source:
  file: upstream/premise_metals/secondary_supply_activities.yaml
  provenance: upstream/premise_metals/provenance.json

share_data:
  directory: ../primary_vs_secondary_metals/scenario_data
  manifest: share_generation_manifest.json
  nonferrous:
    reference:
      file: metal_primary_secondary_shares.yaml
      year: 2020
    conservative:
      file: primary_secondary_split_conservative.yaml
    moderate_recycling:
      file: primary_secondary_split_baseline.yaml
    high_recycling:
      file: primary_secondary_split_optimistic.yaml

nonferrous_cases:
  baseline:
    mode: native
    description: >-
      Keep native premise results unchanged. Older premise interpolates its
      installed targets; newer premise retains recognised existing secondary
      supply. Native baselines can therefore differ between premise versions.
  reference:
    mode: reference
    description: >-
      Fix the supported refined markets to documented 2020 reference shares,
      while retaining the future process inventories and background system.
  conservative:
    mode: minimum
    description: >-
      Set a conservative minimum recycled-input trajectory. Never lower the
      native scenario share. Read the conservative file's targets directly;
      its aluminium decline is not imposed on a higher native recycled fraction.
  moderate_recycling:
    mode: minimum
    description: >-
      Read the generated data file named baseline as a moderate recycling floor.
      This is an explicit override case, not the native premise baseline selector.
  high_recycling:
    mode: minimum
    description: >-
      Higher minimum recycled-input trajectories. Hypothetical sensitivities:
      scrap availability, recovery yields and product quality are not solved.
  primary_only:
    mode: target
    description: >-
      Explicit 0% secondary supply counterfactual, not a central or BAU forecast.

markets:
  - id: aluminium_cast_alloy
    sector: nonferrous
    name: market for aluminium, cast alloy
    reference product: aluminium, cast alloy
    unit: kilogram
    locations: [World, GLO]
    supply_products: ["aluminium, cast alloy"]
    supply_product_note: >-
      The verified exported market supplies cast alloy from both primary and
      scrap-treatment providers. Only same-grade supplies are enabled here;
      primary liquid aluminium is not silently substituted for cast alloy.
    secondary:
      name_contains: [treatment of aluminium scrap]
    source_product: aluminium, cast alloy
    evidence: [jrc_aluminium_2024]
    target_note: >-
      Curves come from the selected scenario file. Minimum mode retains a
      higher native share instead of imposing the 45/55/65% source endpoints.
      Future fractions are sensitivities, not validated cast-alloy forecasts.

  - id: copper_cathode
    sector: nonferrous
    name: market for copper, cathode
    reference product: copper, cathode
    unit: kilogram
    locations: [World, GLO]
    secondary:
      name_contains:
        - treatment of metal part
        - treatment of copper cake
        - treatment of copper scrap
        - treatment of non-Fe-Co-metals
        - treatment of used cable
    source_product: copper, cathode
    evidence: [ica_copper_2023, iea_recycling_2024]
    target_note: >-
      25% is conservative relative to the cited EU scrap contribution; 45%
      is a higher global sensitivity. Neither reproduces the EU forecast or
      equates reduced mining requirements with recycled cathode content.

  - id: nickel_class_1
    sector: nonferrous
    name: market for nickel, class 1
    reference product: nickel, class 1
    unit: kilogram
    locations: [World, GLO]
    secondary:
      name_contains:
        - treatment of metal part of electronics scrap, in copper, anode, by electrolytic refining
    source_product: nickel, class 1
    evidence: [iea_recycling_2024]
    target_note: >-
      The 15/22/30% floors use rounded IEA battery-derived secondary nickel
      divided by global total nickel demand. They exclude stainless-steel
      recycling and are not class-1 share forecasts. Existing same-grade
      electronics-scrap suppliers and full processing burdens are retained as
      an explicit technology proxy; no battery-grade recovery process is invented.

  - id: cobalt
    sector: nonferrous
    name: market for cobalt
    reference product: cobalt
    unit: kilogram
    locations: [World, GLO]
    secondary:
      name_contains: [treatment of used Li-ion battery]
    source_product: cobalt
    evidence: [iea_recycling_2024]
    target_note: >-
      Scales the existing hydrometallurgical/pyrometallurgical recovery recipe.
      The 20/30/40% floors use approximate IEA battery-derived secondary cobalt
      divided by global total cobalt demand. This is not a product-grade share
      forecast or the separate percentage reduction in new mine development.

  - id: lead
    sector: nonferrous
    name: market for lead
    reference product: lead
    unit: kilogram
    locations: [World, GLO]
    secondary:
      name_contains:
        - treatment of scrap lead acid battery, remelting
        - treatment of electronics scrap, metals recovery in copper smelter
    source_product: lead
    evidence: [van_der_voet_2019]
    target_note: >-
      Lower/upper sensitivity around the literature 77% secondary-production
      figure. The same remelting/recovery burdens are retained, not credited away.

  - id: lithium_carbonate_generic
    sector: nonferrous
    name: market for lithium carbonate
    reference product: lithium carbonate
    unit: kilogram
    locations: [GLO]
    source_product: lithium carbonate
    supply_products: ["lithium carbonate"]
    strict_secondary_matching: true
    secondary:
      names: ["treatment of used Li-ion battery, hydrometallurgical treatment"]
    evidence: [iea_critical_minerals_2026, iea_recycling_2024]
    secondary_matching_note: >-
      Rescale only the positive same-product recovery supply already present
      in the native GLO carbonate market. Preserve its full treatment inventory,
      primary-route weights, gross supply and transport exchanges. Do not add
      a recovery process, avoided-burden credit or battery-grade conversion.
    target_note: >-
      Apply the existing lithium evidence-family endpoints as global elemental-Li
      representative-compound sensitivities, not verified carbonate forecasts.
      Conservative is an analyst-selected 15%; moderate/high use the independently
      rechecked approximate 250/1122 and 560/1501 supply/demand ratios.
      The 2020 reference fraction 0.000840414604538239 is the inherited generic
      carbonate share, confirmed in the exported ecoinvent 3.12 GLO market.
      Minimum floors interpolate linearly from 2020 to 2050 and retain higher
      native shares. Ordinary hydroxide benefits through its existing carbonate
      input; no separate hydroxide floor or credit is added. Battery-grade GLO
      carbonate/hydroxide remain native. Baseline is unchanged. Existing RELICS
      Lithium-only factors do not cover Spodumene, so complete elemental-Li
      extraction reductions cannot be inferred from that indicator alone.

  - id: lithium_carbonate_battery_grade
    sector: nonferrous
    name: market for lithium carbonate, battery grade
    reference product: lithium carbonate, battery grade
    unit: kilogram
    locations: [World]
    source_product: lithium carbonate, battery grade
    secondary_source_product: lithium carbonate, battery grade
    # The existing World market already accepts this generic recovered product.
    # This does not invent a new battery-grade purification inventory.
    supply_products: ["lithium carbonate, battery grade", "lithium carbonate"]
    supply_product_note: >-
      Retain the existing native World market's recovered generic lithium
      carbonate interface as an explicit grade-equivalence proxy. No further
      purification, impurity removal, grade conversion, new recovery process
      or assurance of battery-grade quality is inferred. GLO is not overridden
      because no compatible positive secondary recipe was verified there.
    secondary:
      names: ["treatment of used Li-ion battery, hydrometallurgical treatment"]
    evidence: [iea_critical_minerals_2026, iea_recycling_2024]
    target_note: >-
      Interpolate the minimum linearly between the documented 2020 reference
      fraction and the 2050 endpoint, with endpoint clamping, as requested by
      the user. This interpolation is a modelling assumption, not an IEA
      intermediate-year recycling forecast. Conservative uses an analyst 15%
      lower-collection sensitivity; moderate uses 250/1122 in the STEPS context
      and high uses 560/1501 in HDS. These source quantities were independently
      rechecked, but the grade transfer remains a sensitivity. A higher native share is
      retained. The global elemental-Li fraction is applied to this
      carbonate market as a representative-compound sensitivity, not a verified
      battery-grade forecast. Reference and primary-only remain explicit
      counterfactuals; native baseline is unchanged.

  - id: gold
    sector: nonferrous
    name: market for gold
    reference product: gold
    unit: kilogram
    locations: [World, GLO]
    source_product: gold
    strict_secondary_matching: true
    secondary:
      names:
        - treatment of precious metal from electronics scrap, in anode slime, precious metal extraction
    evidence: [wgc_gold_2025]
    secondary_matching_note: >-
      Exact existing e-waste recovery identity, any existing provider location;
      actual ecoinvent 3.12 includes SE/RoW while the pinned upstream selector
      names GLO/RoW. Do not invent a GLO supplier or silently change geography.
      Existing route weights and full recycling burdens are retained. This is
      an explicit e-waste technology proxy for mixed global recycled gold,
      including jewellery; no claim that it represents the actual scrap mix.
    target_note: >-
      Piecewise-linear floor through the unchanged 2020 model reference,
      the reported 2025 physical-supply anchor, and 2050. Conservative holds
      the 2025 anchor; moderate adds 10 percentage points and high adds 20.
      Increments and interpolation are analyst assumptions, not WGC forecasts.

  - id: silver
    sector: nonferrous
    name: market for silver
    reference product: silver
    unit: kilogram
    locations: [World, GLO]
    source_product: silver
    strict_secondary_matching: true
    secondary:
      names:
        - treatment of precious metal from electronics scrap, in anode slime, precious metal extraction
        - treatment of waste x-ray film
    primary_remainder_names:
      - treatment of crust from Parkes process for lead production
    primary_remainder_note: >-
      Exclude Parkes-crust silver from the recycled numerator: this residue
      can originate in primary lead refining and its name does not establish
      recycled provenance. Retain its existing LCI in the non-secondary
      remainder (reported under primary), not a claim of verified virgin
      provenance for every residue input. Within-remainder weights are kept.
    evidence: [silver_survey_2026, ecoinvent_parkes_origin]
    secondary_matching_note: >-
      Only the existing same-product e-waste and x-ray-film recovery providers
      count as secondary. Existing route/location weights and burdens remain.
      This inherited recipe is a proxy, not a future global scrap composition.
      Unlisted recycling activities fail closed rather than becoming primary.
    target_note: >-
      Piecewise-linear floor through unchanged 2020 model reference, the 2025
      secondary/(mine+secondary) anchor, and 2050. Conservative holds anchor;
      moderate/high add 10/20 percentage points as analyst sensitivities.
      Baseline remains untouched; the 2020 catalogue's classification is not
      independently recalibrated to this narrower silver boundary.

  - id: platinum
    sector: nonferrous
    name: market for platinum
    reference product: platinum
    unit: kilogram
    locations: [World, GLO]
    source_product: platinum
    secondary_source_product: platinum
    secondary:
      names: [treatment of automobile catalyst]
    evidence: [jm_pgm_2026]
    secondary_matching_note: >-
      Pinned same-product RER/RoW automobile-catalyst recovery selectors;
      preserve existing technology/location weights and treatment burdens.
      Represents the inherited secondary technology mix, not all global
      recycled Pt sources. Do not add industrial closed-loop recycling again.
    target_note: >-
      Piecewise-linear floor through unchanged 2020 model reference, reported
      2025 open-loop physical supply anchor, and 2050. Conservative holds
      anchor; moderate/high add 10/20 percentage points as analyst-selected
      sensitivities, not Johnson Matthey 2050 projections.

  - id: palladium
    sector: nonferrous
    name: market for palladium
    reference product: palladium
    unit: kilogram
    locations: [World, GLO]
    source_product: palladium
    secondary_source_product: palladium
    secondary:
      names:
        - treatment of automobile catalyst
        - treatment of precious metal from electronics scrap, in anode slime, precious metal extraction
    evidence: [jm_pgm_2026]
    secondary_matching_note: >-
      Pinned same-product catalyst and electronics recovery selectors;
      preserve existing process/location weights and full recycling burdens.
      Vehicle electrification, scrap availability and future scrap composition
      are not solved. Industrial closed-loop flows are not added again.
    target_note: >-
      Piecewise-linear floor through unchanged 2020 model reference, reported
      2025 open-loop physical supply anchor, and 2050. Conservative holds
      anchor; moderate/high add 10/20 percentage points as analyst-selected
      sensitivities, not Johnson Matthey 2050 projections.

excluded_scope:
  - products: [ores, concentrates, mineral feedstocks]
    reason: Mining inputs do not become recycled refined-metal markets by relabelling their supply.
  - products: ["aluminium, primary, ingot", "aluminium, primary, liquid"]
    reason: Explicit-primary product markets remain primary; no implicit grade conversion is added.
  - products: [zinc, rare earth oxides, graphite, tin, manganese, magnesium, rhodium]
    reason: >-
      No jointly verified same-product secondary recipe and appropriate future
      recycled-input trajectory has been approved. Refined-zinc targets do not
      apply to zinc concentrate; tin needs a complete recycling chain. New
      precious-metal refinery data are a candidate, not an imported inventory. Leave
      native supplies unchanged; see docs/metals_literature_review.md.
  - products: [steel, "steel, low-alloyed", "steel, unalloyed", "steel, chromium steel 18/8", "steel, chromium steel 18/10"]
    reason: All steel mixes and production routes remain endogenous to REMIND or the selected EDM-I model; no exogenous steel share overrides are permitted.
