      - name: market for benzene
        product: benzene
        location: NL

      - name: market for benzene
        product: benzene
        location: RoW

      - name: market for benzene
        product: benzene
        location: EUR

      - name: market for benzene
        product: benzene
        location: RER w/o RU

    replaces in:
      - location: NL

  - name: market for toluene (por)
    reference product: toluene, liquid
    unit: kilogram
