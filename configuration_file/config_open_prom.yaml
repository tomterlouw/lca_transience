production pathways:
  # POWER MIX:
  # proxy assumed to represent biofuels...
  biofuel:
    production volume:
      variable: Secondary Energy|Electricity|Biofuels
    ecoinvent alias:
      name: electricity production, at biomethane-fired combined cycle power plant
      reference product: electricity, high voltage
      exists in original database: True

  coal:
    production volume:
      variable: Secondary Energy|Electricity|Coal|w/o CCS
    ecoinvent alias:
      name: electricity production, hard coal
      reference product: electricity, high voltage
      exists in original database: True

  coal_ccs:
    production volume:
      variable: Secondary Energy|Electricity|Coal|w/ CCS
    ecoinvent alias:
      name: electricity production, at hard coal-fired power plant, post, pipeline 200km, storage 1000m
      reference product: electricity, high voltage
      exists in original database: True

  gas:
    production volume:
      variable: Secondary Energy|Electricity|Gas|w/o CCS
    ecoinvent alias:
      name: electricity production, natural gas, combined cycle power plant
      reference product: electricity, high voltage
      exists in original database: True

  gas_ccs:
    production volume:
      variable: Secondary Energy|Electricity|Gas|w/ CCS
    ecoinvent alias:
      name: electricity production, at natural gas-fired combined cycle power plant, post, pipeline 200km, storage 1000m
      reference product: electricity, high voltage
      exists in original database: True

  geothermal:
    production volume:
      variable: Secondary Energy|Electricity|Geothermal and other renewable sources
    ecoinvent alias:
      name: electricity production, deep geothermal
      reference product: electricity, high voltage
      exists in original database: True

  hydro:
    production volume:
      variable: Secondary Energy|Electricity|Hydro
    ecoinvent alias:
      name: electricity production, hydro, pumped storage
      reference product: electricity, high voltage
      exists in original database: True
      mask: renewable energy products

  hydrogen:
    production volume:
      variable: Secondary Energy|Electricity|Hydrogen
    ecoinvent alias:
      name: electricity production, from hydrogen-fired one gigawatt gas turbine, for grid balancing
      reference product: electricity, high voltage
      exists in original database: True
      mask: renewable energy products

  # the scenario does not differentiate between nuclear technologies, PWR most used in EU.
  nuclear:
    production volume:
      variable: Secondary Energy|Electricity|Nuclear
    ecoinvent alias:
      name: electricity production, nuclear, pressure water reactor
      reference product: electricity, high voltage
      exists in original database: True
      mask: heavy water moderated

  oil:
    production volume:
      variable: Secondary Energy|Electricity|Oil
    ecoinvent alias:
      name: electricity production, oil
      reference product: electricity, high voltage
      exists in original database: True
      mask: aluminium industry

  pv:
    production volume:
      variable: Secondary Energy|Electricity|Solar
    ecoinvent alias:
      name: electricity production, photovoltaic
      reference product: electricity, low voltage
      exists in original database: True
      mask: renewable energy products

  wind:
    production volume:
      variable: Secondary Energy|Electricity|Wind
    ecoinvent alias:
      name: electricity production, wind, 1-3MW turbine, onshore
      reference product: electricity, high voltage
      exists in original database: True
      mask: renewable energy products

  #wind (offshore):
  #  production volume:
  #    variable: Secondary Energy|Electricity|Wind|Offshore
  #  ecoinvent alias:
  #    name: electricity production, wind, 1-3MW turbine, offshore
  #    reference product: electricity, high voltage
  #    exists in original database: True
  #    mask: renewable energy products

  #biomass:
  #  production volume:
  #    variable: Secondary Energy|Electricity|Biomass
  #  ecoinvent alias:
  #    name: heat and power co-generation, wood chips, 2000 kW, state-of-the-art 2014
  #    reference product: electricity, high voltage
  #    exists in original database: True
  #     mask: renewable energy products

  medium_to_high:
    production volume:
      variable: Secondary Energy|Electricity
    ecoinvent alias:
      name: market group for electricity, high voltage (SPS)
      reference product: electricity, high voltage
      exists in original database: False
      new dataset: True

  #low_to_medium:
  #  production volume:
  #    variable: Secondary Energy|Electricity
  #  ecoinvent alias:
  #    name: market group for electricity, medium voltage (SPS)
  #    reference product: electricity, medium voltage
  #    exists in original database: False
  #    new dataset: True

  # HYDROGEN MIX:
  h2_bio:
    production volume:
      variable: Secondary Energy|Hydrogen|Biofuels|w/o CCS
    ecoinvent alias:
      name: hydrogen production, steam methane reforming, from biomethane
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  h2_bio_ccs:
    production volume:
      variable: Secondary Energy|Hydrogen|Biofuels|w/ CCS
    ecoinvent alias:
      name: hydrogen production, steam methane reforming, from biomethane, with CCS
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  h2_coal:
    production volume:
      variable: Secondary Energy|Hydrogen|Coal|w/o CCS
    ecoinvent alias:
      name: hydrogen production, coal gasification
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  h2_coal_ccs:
    production volume:
      variable: Secondary Energy|Hydrogen|Coal|w/ CCS
    ecoinvent alias:
      name: hydrogen production, coal gasification, with CCS
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  h2_electrolysis:
  #proxy for all electrolysis-based hydrogen production, as the scenario does not differentiate between electrolysis technologies
    production volume:
      variable: Secondary Energy|Hydrogen|Electricity
    ecoinvent alias:
      name: hydrogen production, gaseous, 20 bar, from AEC electrolysis, from grid electricity
      reference product: hydrogen, gaseous, 20 bar
      exists in original database: True

  h2_gas:
    production volume:
      variable: Secondary Energy|Hydrogen|Gas|w/o CCS
    ecoinvent alias:
      name: hydrogen production, steam methane reforming
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  h2_gas_ccs:
    production volume:
      variable: Secondary Energy|Hydrogen|Gas|w/ CCS
    ecoinvent alias:
      name: hydrogen production, steam methane reforming, with CCS
      reference product: hydrogen, gaseous, low pressure
      exists in original database: True

  ##################### FINAL ENERGY: 
  # Final energy demand variables mapped to ecoinvent/premise LCI aliases.
  # Generated from the provided Final Energy variable list; aggregate-only nodes are omitted.
  #BUNKERS:
  #Final Energy|Bunkers|Electricity
  #Final Energy|Bunkers|Gases
  #Final Energy|Bunkers|Hydrogen
  #Final Energy|Bunkers|Liquids

  ## CDR  
  #FE_cdr_daccs: 
  #  production volume:
  #    variable: Carbon Capture|Direct Air Capture
  #  ecoinvent alias:
  #    name: carbon dioxide removal, with direct air capture #THIS IS WITH STORAGE!
  #    reference product: carbon dioxide removal, with direct air capture
  #    exists in original database: False

markets:
  - name: market for hydrogen (SPS)
    reference product: hydrogen, gaseous, low pressure
    unit: kilogram
    includes:
      - h2_bio
      - h2_bio_ccs
      - h2_coal
      - h2_coal_ccs
      - h2_electrolysis
      - h2_gas
      - h2_gas_ccs

    replaces:
      - name: market for hydrogen, gaseous, low pressure
        product: hydrogen, gaseous, low pressure
        operator: contains

  ################
  ################      

  - name: market group for electricity, high voltage (SPS)
    reference product: electricity, high voltage
    unit: kilowatt hour
    includes:
      - biofuel
      - coal
      - coal_ccs
      - gas
      - gas_ccs
      - geothermal
      - hydro
      - hydrogen
      - nuclear
      - oil
      - pv
      - wind

    add:
      - name: transmission network construction, electricity, high voltage
        reference product: transmission network, electricity, high voltage
        amount: 6.58e-09

      - name: Dinitrogen monoxide
        categories: air
        unit: kilogram
        amount: 5.0e-06

      - name: Ozone
        categories: air
        unit: kilogram
        amount: 4.16e-06

    replaces:
      - name: market group for electricity, high voltage
        product: electricity, high voltage
        operator: contains

  - name: market group for electricity, medium voltage (SPS)
    reference product: electricity, medium voltage
    unit: kilowatt hour
    includes:
      - medium_to_high

    add:
      - name: market for sulfur hexafluoride, liquid
        reference product: sulfur hexafluoride, liquid
        amount: 5.4e-08

      - name: transmission network construction, electricity, medium voltage
        reference product: transmission network, electricity, medium voltage
        amount: 1.86e-08

      - name: Sulfur hexafluoride
        categories: air
        unit: kilogram
        amount: 5.4e-08

      - name: market group for electricity, high voltage (SPS)
        reference product: electricity, high voltage
        amount: 0.065

    replaces:
      - name: market group for electricity, medium voltage
        product: electricity, medium voltage
        operator: contains

  - name: market group for electricity, low voltage (SPS)
    reference product: electricity, low voltage
    unit: kilowatt hour
    includes:
      - medium_to_high #NOTE!!

    add:
      - name: market for sulfur hexafluoride, liquid
        reference product: sulfur hexafluoride, liquid
        amount: 2.99e-09

      - name: distribution network construction, electricity, low voltage
        reference product: distribution network, electricity, low voltage
        amount: 8.74e-08

      - name: Sulfur hexafluoride
        categories: air
        unit: kilogram
        amount: 2.99e-09

      - name: market group for electricity, medium voltage (SPS)
        reference product: electricity, medium voltage
        amount: 0.027

    replaces:
      - name: market group for electricity, low voltage
        product: electricity, low voltage
        operator: contains

  - name: market for electricity, high voltage (SPS)
    reference product: electricity, high voltage
    unit: kilowatt hour
    includes:
      - biofuel
      - coal
      - coal_ccs
      - gas
      - gas_ccs
      - geothermal
      - hydro
      - hydrogen
      - nuclear
      - oil
      - pv
      - wind

    add:
      - name: transmission network construction, electricity, high voltage
        reference product: transmission network, electricity, high voltage
        amount: 6.58e-09

      - name: Dinitrogen monoxide
        categories: air
        unit: kilogram
        amount: 5.0e-06

      - name: Ozone
        categories: air
        unit: kilogram
        amount: 4.16e-06

    replaces:
      - name: market for electricity, high voltage
        product: electricity, high voltage
        operator: contains

  - name: market for electricity, medium voltage (SPS)
    reference product: electricity, medium voltage
    unit: kilowatt hour
    includes:
      - medium_to_high

    add:
      - name: market for sulfur hexafluoride, liquid
        reference product: sulfur hexafluoride, liquid
        amount: 5.4e-08

      - name: transmission network construction, electricity, medium voltage
        reference product: transmission network, electricity, medium voltage
        amount: 1.86e-08

      - name: Sulfur hexafluoride
        categories: air
        unit: kilogram
        amount: 5.4e-08

      - name: market for electricity, high voltage (SPS)
        reference product: electricity, high voltage
        amount: 0.065

    replaces:
      - name: market for electricity, medium voltage
        product: electricity, medium voltage
        operator: contains

  - name: market for electricity, low voltage (SPS)
    reference product: electricity, low voltage
    unit: kilowatt hour
    includes:
      - medium_to_high

    add:
      - name: market for sulfur hexafluoride, liquid
        reference product: sulfur hexafluoride, liquid
        amount: 2.99e-09

      - name: distribution network construction, electricity, low voltage
        reference product: distribution network, electricity, low voltage
        amount: 8.74e-08

      - name: Sulfur hexafluoride
        categories: air
        unit: kilogram
        amount: 2.99e-09

      - name: market for electricity, medium voltage (SPS)
        reference product: electricity, medium voltage
        amount: 0.027

    replaces:
      - name: market for electricity, low voltage
        product: electricity, low voltage
        operator: contains